<!DOCTYPE html>
<html lang="en">

<head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Private Art Auction</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
                rel="stylesheet">
                
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
                rel="stylesheet">

        <link rel="stylesheet" href="css/login.css">

        <style>
                .legal-links {
                        margin-top: 30px;
                        text-align: center;
                        font-size: 13px;
                }
                .legal-links a {
                        color: #9ca3af;
                        text-decoration: none;
                        margin: 0 10px;
                        transition: color 0.2s;
                }
                .legal-links a:hover { color: #d4af37; }
        </style>

</head>


<body>


        <div class="background">

                <div class="orb orb-one"></div>
                <div class="orb orb-two"></div>

        </div>



        <main class="container">


                <section class="login-card">


                        <div class="logo">

                                <span></span>
                                ART AUCTION
                                <span></span>

                        </div>


                        <h1>
                                Private Gallery Access
                        </h1>


                        <p class="subtitle">

                                Enter your exclusive session key to access
                                this auction event.

                        </p>



                        <div class="code-container">


                                <input maxlength="1" class="code-input" autofocus>
                                <input maxlength="1" class="code-input">
                                <input maxlength="1" class="code-input">
                                <input maxlength="1" class="code-input">
                                <input maxlength="1" class="code-input">
                                <input maxlength="1" class="code-input">


                        </div>



                        <button id="enterButton">

                                Enter Auction

                        </button>



                        <div class="security">

                                <span>✦</span>
                                Invitation Only
                                <span>✦</span>

                        </div>

                        <div class="legal-links">
                                <a href="terms-and-conditions.html" target="_blank">Terms & Conditions</a>
                                &bull;
                                <a href="privacy-policy.html" target="_blank">Privacy Policy</a>
                        </div>



                </section>


        </main>



        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script src="js/login.js"></script>


</body>

</html>
